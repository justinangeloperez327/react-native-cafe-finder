name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate dependency lockfile
        run: |
          node -e "const p=require('./package.json');const l=require('./package-lock.json').packages[''];for(const [name,version] of Object.entries({...p.dependencies,...p.devDependencies})){const actual=l.dependencies?.[name]??l.devDependencies?.[name];if(actual!==version){console.error(name+': package.json='+version+', lockfile='+actual);process.exitCode=1}}"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Expo compatibility
        run: npx expo-doctor
